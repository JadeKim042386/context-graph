<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6e7681"/></marker><marker id="arrow_accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a5b4fc"/></marker><marker id="arrow_good" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6ee7b7"/></marker></defs><rect width="880" height="330" rx="10" fill="#0d1117"/><rect x="16" y="34" width="150" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="91" y="58" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="middle">A question</text><text x="91" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">what was that figure?</text><line x1="170" y1="63" x2="206" y2="63" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#arrow_accent)"/><rect x="212" y="26" width="176" height="74" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/><text x="300" y="50" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Ask the map</text><text x="300" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">in the language the</text><text x="300" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">documents are written in</text><line x1="392" y1="63" x2="428" y2="63" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#arrow_accent)"/><rect x="434" y="26" width="206" height="74" rx="8" fill="#052e23" stroke="#047857" stroke-width="1"/><text x="537" y="50" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="middle">The answer</text><text x="537" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">the statement, and file:line</text><text x="537" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">usually the end of it</text><line x1="644" y1="63" x2="680" y2="63" stroke="#6ee7b7" stroke-width="1.6" marker-end="url(#arrow_good)"/><rect x="686" y="34" width="178" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="775" y="58" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Answer, with the source</text><text x="775" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">a few hundred characters</text><path d="M537,104 L537,126" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="434" y="132" width="206" height="48" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="537" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">Need more? open those lines</text><text x="537" y="170" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">three or more places: delegate</text><line x1="16" y1="204" x2="864" y2="204" stroke="#30363d"/><text x="16" y="228" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="start">The map is rebuilt at four points, never on a question</text><rect x="16" y="240" width="198" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="115" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">session starts</text><text x="115" y="279" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#8b949e" text-anchor="middle">0.10 s</text><rect x="230" y="240" width="198" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="329" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">delegated work ends</text><text x="329" y="279" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#8b949e" text-anchor="middle">0.10 s</text><rect x="444" y="240" width="198" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="543" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">just before compaction</text><text x="543" y="279" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#8b949e" text-anchor="middle">writes the session down</text><rect x="658" y="240" width="198" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="757" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e6edf3" text-anchor="middle">just after</text><text x="757" y="279" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#8b949e" text-anchor="middle">0.10 s</text><text x="16" y="312" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">In between it says how far behind it is, in 3 ms, and answers anyway.</text></svg>