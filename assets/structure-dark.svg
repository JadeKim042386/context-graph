<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6e7681"/></marker><marker id="arrow_accent" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a5b4fc"/></marker><marker id="arrow_good" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6ee7b7"/></marker></defs><rect width="880" height="300" rx="10" fill="#0d1117"/><rect x="16" y="40" width="224" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="128" y="66" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Your documents</text><text x="128" y="84" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">markdown and HTML</text><rect x="30" y="98" width="196" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="42" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start">Statements</text><text x="42" y="136" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">the figures live here</text><rect x="30" y="164" width="196" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="42" y="184" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start">Relations you wrote</text><text x="42" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="400" fill="#8b949e" text-anchor="start">- supersedes [[...]]</text><line x1="246" y1="140" x2="288" y2="140" stroke="#6ee7b7" stroke-width="1.6" marker-end="url(#arrow_good)"/><text x="267" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">copy</text><rect x="294" y="62" width="210" height="156" rx="10" fill="#052e23" stroke="#047857" stroke-width="1.5"/><text x="399" y="88" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Copy, do not guess</text><text x="399" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">statement -&gt; node, verbatim</text><text x="399" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">relation -&gt; link, same name</text><text x="399" y="148" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="middle">file and line kept on every node</text><text x="399" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">no language model</text><text x="399" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">0.10 s for 175 documents</text><line x1="510" y1="140" x2="552" y2="140" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#arrow_accent)"/><rect x="558" y="40" width="306" height="152" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/><text x="711" y="66" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">One map, three answers</text><rect x="574" y="78" width="274" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="586" y="98" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="start">Value  —  the statement, plus file:line</text><rect x="574" y="114" width="274" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="586" y="134" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="start">Connection  —  what touches what</text><rect x="574" y="150" width="274" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/><text x="586" y="170" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#e6edf3" text-anchor="start">Lineage  —  what superseded what</text><line x1="711" y1="198" x2="711" y2="224" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#arrow_accent)"/><rect x="558" y="230" width="306" height="52" rx="10" fill="#0d1117" stroke="#4338ca" stroke-width="1"/><text x="711" y="252" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Open only the line it cites</text><text x="711" y="270" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">never the whole file</text><text x="16" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">Documents are read, never written to.</text></svg>